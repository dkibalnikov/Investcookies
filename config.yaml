params:
    homeInfoParams:
        Title: 🍪 🍪 🪙
        Content: Блог про инвестиции, финансы, экономику, data scienсe, визуализацию -- **Больше количественного и качественного анализа** 😎  <br><br> Hi there 👋 this is blog about data science, financial markets and economics
