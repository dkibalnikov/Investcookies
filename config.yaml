theme: "hugo-PaperMod"
baseURL: /
languageCode: ru-Ru
title: InvestCookies

params:
    homeInfoParams:
        Title: 🍪 🍪 🪙
        Content: Блог про инвестиции, финансы, экономику, datascienсe, визуализацию - **вне политики и без сомнительных спонсоров** 😎 <br><br> Hi there 👋 this is blog about data science, financial markets and economics
    socialIcons: # optional
        - name: "email"
          url: "mailto:d.kibalnikov@gmail.com"
        - name: "github"
          url: "https://github.com/dkibalnikov"
        - name: "telegram"
          url: "https://t.me/Kb_Dm"
        - name: "rss"
          url: "index.xml"
        - name: "linkedin"
          url: "https://www.linkedin.com/in/dmitry-kibalnikov-7134aa2a/"
        - name: "facebook"
          url: "https://www.facebook.com/Kibalnikov.Dmitry"
    ShowReadingTime: true
    ShowBreadCrumbs: true
    ShowPostNavLinks: true
    comments: true
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys: ["title", "permalink", "summary", "content"]
    env: production # to enable google analytics, opengraph, twitter-cards and schema.

outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary

menu:
    main:
        - identifier: categories
          name: categories
          url: /categories/
          weight: 10
        - identifier: tags
          name: tags
          url: /tags/
          weight: 20
        - identifier: search
          name: search
          url: /search/
          weight: 30
          
disqusShortname: dmitrykibalnikov
          
markup:
  goldmark:
    renderer:
      unsafe: true

googleAnalytics: G-STNC3D15LX

