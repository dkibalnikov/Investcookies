        - name: "email"
          url: "mailto:d.kibalnikov@gmail.com"
        - name: "github"
          url: "https://github.com/dkibalnikov"
        - name: "telegram"
          url: "https://t.me/investcookies"
        - name: "rss"
          url: "index.xml"
        - name: "linkedin"
          url: "https://www.linkedin.com/in/dmitry-kibalnikov-7134aa2a/"
        - name: "facebook"
          url: "https://www.facebook.com/Kibalnikov.Dmitry"
    ShowReadingTime: true
    ShowBreadCrumbs: true
    ShowPostNavLinks: true
    comments: true
